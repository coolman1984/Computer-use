name: Recover SmartOps 2ad2272

on:
  push:
    branches:
      - recovery/2ad2272

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/2ad2272
          fetch-depth: 0

      - name: Rebuild and verify final files
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/app.part* | base64 -d | gzip -d > src/smartops/api/app.py
          cat .recovery/hardening.part* | base64 -d | gzip -d > tests/test_contract_hardening.py
          cat .recovery/web.part* | base64 -d | gzip -d > tests/test_web_app.py

          test "$(git hash-object src/smartops/api/app.py)" = "5091f8c133b682f55acf1f2ae0d124cd9f736729"
          test "$(git hash-object tests/test_contract_hardening.py)" = "1d80cfa2a832f41e25b3746303c3876e193de5da"
          test "$(git hash-object tests/test_web_app.py)" = "ba664157840f706d60af3de4d95677cc2ebc6932"

      - name: Commit exact recovered working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          git rm -f .github/workflows/recover-smartops-2ad2272.yml
          git add -A
          git config user.name "SmartOps Recovery"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore verified SmartOps 2ad2272 working tree"
          git push origin HEAD:recovery/2ad2272
