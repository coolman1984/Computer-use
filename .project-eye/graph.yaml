entrypoints:
- id: __main__
  purpose: python -m smartops
- id: cli
  purpose: the operator's terminal commands, and the one that serves the app
- id: credential_prompt
  purpose: the separate window that asks for a password
- id: main
  purpose: the web application, as a server would import it
- id: scheduler
  purpose: the clock that starts scheduled runs
- id: services
  purpose: the object graph everything else is reached through
- id: worker
  purpose: the background worker that executes runs
