# Example system definition.
#
# You do NOT need to write these by hand — the Systems page in the app creates
# and edits them for you, and reads them back from this same format. This file
# is here so you can see the shape, and hand-edit if you prefer.
#
# Real definitions belong in a folder OUTSIDE this public repository, pointed at
# by SMARTOPS_SYSTEMS_DIR. Never put internal URLs or company data here.

key: erp_demo
name: Demo system for sales reports

auth:
  mode: session
  login_url: "https://intranet.example.local/login"
  logged_in_selector: "#user-menu"
  login_selector: "#login-form"
  # For unattended runs, use mode: unattended and add selectors below.
  # Never put real credentials in YAML; save them in /app/credentials.html.
  # credential_ref: erp_demo
  # username_selector: "#username"
  # password_selector: "#password"
  # submit_selector: "button[type=submit]"

reports:
  - key: daily_sales
    title: Daily sales report
    url: "https://intranet.example.local/reports/daily-sales"
    download_selector: "#export-csv"
    wait_selector: "#report-ready"
    period: daily
    normal_duration_seconds: 45
    validation_rules:
      min_size_bytes: 100
      expected_extensions: [".csv"]
      required_columns: ["date", "amount"]
      min_rows: 1
      max_age_hours: 24
    alert:
      warn_after_seconds: 90
      critical_after_seconds: 180
    schedule:
      daily_at: "08:00"

  - key: weekly_summary
    title: Weekly summary
    direct_download_url: "https://intranet.example.local/exports/weekly-summary.csv"
    url: "https://intranet.example.local/reports/weekly-summary"
    period: weekly
    normal_duration_seconds: 20
    validation_rules:
      min_size_bytes: 50
      expected_extensions: [".csv"]
      min_rows: 1
    alert:
      warn_after_seconds: 60
    schedule:
      every_seconds: 3600
