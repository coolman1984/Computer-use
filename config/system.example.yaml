app:
  name: SmartOps
  environment: development
  host: 127.0.0.1
  port: 8765

storage:
  sqlite_path: data/smartops.db
  raw_data_dir: data/raw
  incidents_dir: incidents
  logs_dir: logs
  history_dir: data/history
  sessions_dir: data/sessions
  systems_dir: config/systems   # للتعريفات الحقيقية: استخدم SMARTOPS_SYSTEMS_DIR لمجلد خارج المستودع
  recordings_dir: data/recordings # للإنتاج: SMARTOPS_RECORDINGS_DIR خارج المستودع

browser:
  engine: playwright
  headless: true
  default_viewport:
    width: 1440
    height: 900
  max_concurrency: 4

agents:
  codex:
    enabled: false
    mode: read_only    # الوضع المدعوم الوحيد حاليًا. أي قيمة أخرى ترفض التركيب بخطأ واضح.
    executable: ""     # فاضي = استخدم "codex" كأمر تشغيل
  claude:
    enabled: false
    mode: read_only
    executable: ""     # فاضي = استخدم "claude" كأمر تشغيل

# قناة السجل المحلي (logs_dir/alerts.jsonl) شغّالة دائمًا. أضف رابط
# Webhook هنا (أو عبر SMARTOPS_WEBHOOK_URL) لو عايز قناة إضافية.
notify:
  webhook_url: ""

safety:
  allow_production_code_changes: false
  allow_destructive_actions: false
  require_approval_for_sensitive_actions: true
