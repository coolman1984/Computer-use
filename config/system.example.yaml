app:
  name: SmartOps
  environment: development
  host: 127.0.0.1
  port: 8765

storage:
  sqlite_path: data/smartops.db
  raw_data_dir: data/raw
  incidents_dir: incidents
  logs_dir: logs
  history_dir: data/history
  sessions_dir: data/sessions
  systems_dir: config/systems   # for real definitions: use SMARTOPS_SYSTEMS_DIR pointing outside the repo
  recordings_dir: data/recordings # for production: SMARTOPS_RECORDINGS_DIR outside the repo
  recordings_backup_dir: data/recording-backups # for production: a private path outside the repo
  recordings_retention_days: 0 # 0 = disable automatic permanent deletion

browser:
  engine: playwright
  headless: true
  default_viewport:
    width: 1440
    height: 900
  max_concurrency: 4

agents:
  codex:
    enabled: false
    mode: read_only    # the only mode currently supported. Any other value rejects the wiring with a clear error.
    executable: ""     # empty = use "codex" as the launch command
  claude:
    enabled: false
    mode: read_only
    executable: ""     # empty = use "claude" as the launch command

# The local log channel (logs_dir/alerts.jsonl) always runs. Add a webhook
# URL here (or via SMARTOPS_WEBHOOK_URL) if you want an extra channel.
notify:
  webhook_url: ""

safety:
  allow_production_code_changes: false
  allow_destructive_actions: false
  require_approval_for_sensitive_actions: true
  allow_recording_purge: false
