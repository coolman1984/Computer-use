<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runs — SmartOps</title>
<link rel="stylesheet" href="static/style.css" />
</head>
<body data-page="runs" data-title="Runs">
<header class="top">
  <h1>غرفة القيادة</h1>
  <nav class="main">
    <a href="index.html">لوحة الحالة</a>
    <a href="runs.html" class="active">التشغيلات</a>
    <a href="recordings.html">التسجيلات</a>
    <a href="incidents.html">الحوادث</a>
    <a href="files.html">الملفات</a>
  </nav>
</header>
<main>
  <div id="error"></div>

  <section class="panel">
    <h2>Start a workflow</h2>
    <p class="muted">Ready to use: <code>platform.selfcheck</code> verifies the local platform without any extra configuration.</p>
    <div class="toolbar">
      <input type="text" id="workflow-key" placeholder="Workflow key" value="platform.selfcheck" />
      <button id="start-run">Start run</button>
    </div>
    <details>
      <summary class="muted">Optional parameters</summary>
      <textarea id="workflow-params" placeholder='Example: {"system": "erp_demo", "report": "daily_sales"}'></textarea>
    </details>
  </section>

  <section class="panel">
    <h2>All runs</h2>
    <div class="toolbar">
      <label class="muted" for="status-filter">Status:</label>
      <select id="status-filter">
        <option value="">All statuses</option><option value="queued">Queued</option><option value="running">Running</option><option value="waiting">Waiting</option><option value="retrying">Retrying</option><option value="succeeded">Succeeded</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option>
      </select>
    </div>
    <table>
      <thead>
        <tr><th>Workflow</th><th>Status</th><th>Created</th><th>Finished</th><th></th></tr>
      </thead>
      <tbody id="runs-body"><tr><td colspan="5" class="empty">Loading runs…</td></tr></tbody>
    </table>
  </section>
</main>

<script src="static/app.js"></script>
<script>
const { getJSON, postJSON, formatDate, statusBadge, RUN_STATUS_LABELS, link, showError, el } = SmartOps;
const errorBox = document.getElementById("error");

async function loadRuns() {
  const status = document.getElementById("status-filter").value;
  const url = status ? `/api/runs?status=${encodeURIComponent(status)}&limit=100` : "/api/runs?limit=100";
  try {
    const data = await getJSON(url);
    const tbody = document.getElementById("runs-body");
    tbody.innerHTML = "";
    if (data.items.length === 0) {
      tbody.appendChild(el("tr", {}, [el("td", { colspan: "5", class: "empty" }, ["No matching runs"])]));
      return;
    }
    for (const run of data.items) {
      tbody.appendChild(el("tr", {}, [
        el("td", {}, [run.workflow_key]),
        el("td", {}, [statusBadge(RUN_STATUS_LABELS, run.status)]),
        el("td", {}, [formatDate(run.created_at)]),
        el("td", {}, [formatDate(run.finished_at)]),
        el("td", {}, [link("View", `run.html?id=${encodeURIComponent(run.id)}`)]),
      ]));
    }
  } catch (err) {
    showError(errorBox, err);
  }
}

document.getElementById("status-filter").addEventListener("change", loadRuns);

document.getElementById("start-run").addEventListener("click", async (event) => {
  const button = event.target;
  const workflow = document.getElementById("workflow-key").value.trim();
  if (!workflow) return;
  let params = {};
  const raw = document.getElementById("workflow-params").value.trim();
  if (raw) {
    try {
      params = JSON.parse(raw);
    } catch (_) {
      showError(errorBox, new Error("Optional parameters must be valid JSON."));
      return;
    }
  }
  button.disabled = true;
  try {
    const run = await postJSON("/api/runs", { workflow, params, start: true });
    location.href = `run.html?id=${encodeURIComponent(run.id)}`;
  } catch (err) {
    showError(errorBox, err);
  } finally {
    button.disabled = false;
  }
});

loadRuns();
</script>
</body>
</html>
