<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Files — SmartOps</title>
<link rel="stylesheet" href="static/style.css" />
</head>
<body data-page="files" data-title="Files">
<header class="top"></header>
<main>
  <div id="error"></div>

  <section class="panel">
    <h2>Downloaded files</h2>
    <p class="muted">Every file collected from every system, with its validation result before approval.</p>
    <div class="toolbar">
      <label class="muted" for="run-filter">Filter by run ID (optional):</label>
      <input type="text" id="run-filter" placeholder="Example: run_01ABC…" />
      <button id="apply-filter">Apply</button>
    </div>
    <table>
      <thead>
        <tr><th>System</th><th>Report</th><th>Status</th><th>Size</th><th>Rows</th><th>Downloaded</th></tr>
      </thead>
      <tbody id="files-body"><tr><td colspan="6" class="empty">Loading files…</td></tr></tbody>
    </table>
  </section>
</main>

<script src="static/app.js"></script>
<script>
const { getJSON, formatDate, statusBadge, VALIDATION_STATUS_LABELS, showError, el } = SmartOps;
const errorBox = document.getElementById("error");

function formatSize(bytes) {
  if (!bytes) return "0 B";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

async function loadFiles() {
  const runId = document.getElementById("run-filter").value.trim();
  const url = runId ? `/api/files?run_id=${encodeURIComponent(runId)}&limit=200` : "/api/files?limit=200";
  try {
    const data = await getJSON(url);
    const tbody = document.getElementById("files-body");
    tbody.innerHTML = "";
    if (data.items.length === 0) {
      tbody.appendChild(el("tr", {}, [el("td", { colspan: "6", class: "empty" }, ["No matching files"])]));
      return;
    }
    for (const file of data.items) {
      tbody.appendChild(el("tr", {}, [
        el("td", {}, [file.system]),
        el("td", {}, [file.report]),
        el("td", {}, [statusBadge(VALIDATION_STATUS_LABELS, file.validation_status)]),
        el("td", {}, [formatSize(file.size_bytes)]),
        el("td", {}, [file.row_count == null ? "—" : String(file.row_count)]),
        el("td", {}, [formatDate(file.created_at)]),
      ]));
    }
  } catch (err) {
    showError(errorBox, err);
  }
}

document.getElementById("apply-filter").addEventListener("click", loadFiles);
document.getElementById("run-filter").addEventListener("keydown", (event) => {
  if (event.key === "Enter") loadFiles();
});
loadFiles();
</script>
</body>
</html>
