<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credentials — SmartOps</title><link rel="stylesheet" href="static/style.css"></head><body data-page="credentials" data-title="Credentials">
<header class="top"></header><main>
  <div id="error"></div>
  <section class="panel credential-warning"><h2>Unattended sign-in</h2><p class="muted">SmartOps stores credentials in Windows Credential Manager under your Windows account. Passwords are never displayed, logged, added to SQLite, or included in browser recordings.</p></section>
  <section class="panel"><h2>Save a credential</h2><form id="credential-form" class="credential-form">
    <label>Target system<select id="system" required></select></label>
    <label>Username<input id="username" type="text" autocomplete="username" required maxlength="256"></label>
    <label>Password<input id="password" type="password" autocomplete="new-password" required maxlength="1024"></label>
    <button type="submit">Save securely</button>
  </form><p id="message" class="muted" role="status"></p></section>
  <section class="panel"><div class="toolbar"><h2>Stored credentials</h2><button id="refresh" class="secondary" type="button">Refresh</button></div><table><thead><tr><th>System</th><th>Username</th><th>Status</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody></table></section>
</main><script src="static/app.js"></script><script src="static/credentials.js"></script></body></html>
