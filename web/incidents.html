<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Issues — SmartOps</title>
<link rel="stylesheet" href="static/style.css" />
</head>
<body data-page="incidents" data-title="Issues">
<header class="top"></header>
<main>
  <div id="error"></div>

  <section class="panel">
    <h2>Step 11 · Watch and fix</h2>
    <p class="muted">When a run fails, an issue is opened here automatically with everything needed to understand it. Each one tells you what happened, what to do, and gives you the button that does it.</p>
    <div class="toolbar">
      <label class="muted" for="status-filter">Show:</label>
      <select id="status-filter">
        <option value="open" selected>Needs attention</option>
        <option value="">Everything</option>
        <option value="resolved">Handled</option>
        <option value="escalated">Escalated</option>
      </select>
    </div>
  </section>

  <section class="panel">
    <div id="incidents-list"><p class="empty">Loading…</p></div>
  </section>
</main>

<script src="static/app.js"></script>
<script>
const {
  getJSON, postJSON, formatDate, statusBadge, SEVERITY_LABELS, INCIDENT_STATUS_LABELS,
  showError, clearError, el, paintShell,
} = SmartOps;
const errorBox = document.getElementById("error");

/* An issue is rendered as a card, not a table row: the useful part is the
   explanation and the fix button, and neither fits in a cell. */
function incidentCard(incident) {
  const card = el("article", { class: "issue-card" }, [
    el("div", { class: "issue-head" }, [
      el("strong", {}, [incident.title]),
      statusBadge(INCIDENT_STATUS_LABELS, incident.status),
      statusBadge(SEVERITY_LABELS, incident.severity),
    ]),
    el("p", { class: "muted hint" }, [`Opened ${formatDate(incident.created_at)}`]),
  ]);

  if (incident.guidance) {
    card.appendChild(el("p", { class: "issue-what" }, [incident.guidance.what_happened]));
    card.appendChild(el("p", { class: "muted" }, [incident.guidance.what_to_do]));
  }

  const actions = el("div", { class: "toolbar" }, []);
  if (incident.guidance?.action?.label) {
    actions.appendChild(el("a", { class: "button-link", href: incident.guidance.action.href },
      [incident.guidance.action.label]));
  }
  if (incident.run_id) {
    actions.appendChild(el("a", { class: "link", href: `run.html?id=${encodeURIComponent(incident.run_id)}` },
      ["See exactly where it stopped"]));
  }
  if (incident.status !== "resolved") {
    const resolve = el("button", { type: "button", class: "secondary" }, ["Mark as handled"]);
    resolve.addEventListener("click", async () => {
      resolve.disabled = true;
      clearError(errorBox);
      try {
        await postJSON(`/api/incidents/${incident.id}/resolve`, {});
        await load();
        paintShell();
      } catch (err) {
        showError(errorBox, err);
        resolve.disabled = false;
      }
    });
    actions.appendChild(resolve);
  }
  card.appendChild(actions);
  return card;
}

async function load() {
  const status = document.getElementById("status-filter").value;
  const url = status ? `/api/incidents?status=${encodeURIComponent(status)}&limit=100` : "/api/incidents?limit=100";
  try {
    const data = await getJSON(url);
    const list = document.getElementById("incidents-list");
    list.innerHTML = "";
    if (!data.items.length) {
      list.appendChild(el("p", { class: "empty" }, ["Nothing needs your attention."]));
      return;
    }
    for (const incident of data.items) list.appendChild(incidentCard(incident));
  } catch (err) {
    showError(errorBox, err);
  }
}

document.getElementById("status-filter").addEventListener("change", load);
load();
</script>
</body>
</html>
