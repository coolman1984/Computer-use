<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Incidents — SmartOps</title>
<link rel="stylesheet" href="static/style.css" />
</head>
<body data-page="incidents" data-title="Incidents">
<header class="top"></header>
<main>
  <div id="error"></div>

  <section class="panel">
    <h2>Incident queue</h2>
    <p class="muted">Failures create an incident here automatically with the evidence needed for diagnosis.</p>
    <div class="toolbar">
      <label class="muted" for="status-filter">Status:</label>
      <select id="status-filter">
        <option value="">All statuses</option><option value="open" selected>Open</option><option value="diagnosing">Diagnosing</option><option value="fixing">Fixing</option><option value="resolved">Resolved</option><option value="escalated">Escalated</option>
      </select>
    </div>
    <table>
      <thead><tr><th>Title</th><th>Severity</th><th>Status</th><th>Opened</th><th></th></tr></thead>
      <tbody id="incidents-body"><tr><td colspan="5" class="empty">Loading incidents…</td></tr></tbody>
    </table>
  </section>
</main>

<script src="static/app.js"></script>
<script>
const { getJSON, formatDate, statusBadge, SEVERITY_LABELS, INCIDENT_STATUS_LABELS, link, showError, el } = SmartOps;
const errorBox = document.getElementById("error");

async function loadIncidents() {
  const status = document.getElementById("status-filter").value;
  const url = status ? `/api/incidents?status=${encodeURIComponent(status)}&limit=100` : "/api/incidents?limit=100";
  try {
    const data = await getJSON(url);
    const tbody = document.getElementById("incidents-body");
    tbody.innerHTML = "";
    if (data.items.length === 0) {
      tbody.appendChild(el("tr", {}, [el("td", { colspan: "5", class: "empty" }, ["No matching incidents — all clear"])]));
      return;
    }
    for (const incident of data.items) {
      tbody.appendChild(el("tr", {}, [
        el("td", {}, [incident.title]),
        el("td", {}, [statusBadge(SEVERITY_LABELS, incident.severity)]),
        el("td", {}, [statusBadge(INCIDENT_STATUS_LABELS, incident.status)]),
        el("td", {}, [formatDate(incident.created_at)]),
        el("td", {}, [incident.run_id ? link("View run", `run.html?id=${encodeURIComponent(incident.run_id)}`) : "—"]),
      ]));
    }
  } catch (err) {
    showError(errorBox, err);
  }
}

document.getElementById("status-filter").addEventListener("change", loadIncidents);
loadIncidents();
</script>
</body>
</html>
