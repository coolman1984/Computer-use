<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Run — SmartOps</title>
<link rel="stylesheet" href="static/style.css" />
</head>
<body data-page="runs" data-title="Run">
<header class="top"></header>
<main>
  <div id="error"></div>
  <p class="muted"><a class="link" href="runs.html">← Back to runs</a></p>

  <section class="panel">
    <h2>What happened</h2>
    <div class="grid" id="run-info"><div class="empty">Loading…</div></div>
    <div id="run-guidance"></div>
    <div class="toolbar">
      <button id="retry-button" type="button">Try again</button>
      <span class="muted" id="retry-hint"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Files it produced</h2>
    <table>
      <thead><tr><th>File</th><th>Checked</th><th>Size</th><th>Rows</th><th></th></tr></thead>
      <tbody id="files-body"><tr><td colspan="5" class="empty">None</td></tr></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Step by step</h2>
    <table>
      <thead><tr><th>Step</th><th>Result</th><th>Attempts</th><th>Note</th></tr></thead>
      <tbody id="steps-body"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Activity <span id="live-dot" class="live-dot"></span></h2>
    <ul class="timeline" id="events-list"><li class="empty">Loading…</li></ul>
  </section>
</main>

<script src="static/app.js"></script>
<script>
const {
  getJSON, postJSON, formatDate, formatSize, statusBadge, RUN_STATUS_LABELS, STEP_STATUS_LABELS,
  VALIDATION_STATUS_LABELS, EVENT_TYPE_LABELS, connectEvents, el, showError, clearError,
} = SmartOps;

const runId = new URLSearchParams(location.search).get("id");
const errorBox = document.getElementById("error");

if (!runId) showError(errorBox, new Error("No run selected. Go back and choose one."));

let currentRun = null;

function renderRunInfo(run) {
  currentRun = run;
  const grid = document.getElementById("run-info");
  grid.innerHTML = "";
  const card = (title, value) => {
    const box = el("div", { class: "card" }, [el("h3", { text: title }, [])]);
    box.appendChild(value instanceof Node ? value : document.createTextNode(value));
    return box;
  };
  const system = run.params?.system;
  const report = run.params?.report;
  grid.appendChild(card("What ran", system && report ? `${report} — ${system}` : run.workflow_key));
  grid.appendChild(card("Result", statusBadge(RUN_STATUS_LABELS, run.status)));
  grid.appendChild(card("Started", formatDate(run.started_at)));
  grid.appendChild(card("Finished", formatDate(run.finished_at)));
  const button = document.getElementById("retry-button");
  // A succeeded run has nothing to retry; anything else does, and the label says
  // which of the two things the button will do.
  button.disabled = run.status === "succeeded";
  button.textContent = ["failed", "cancelled"].includes(run.status) ? "Try again" : "Continue this run";
  if (run.params?.retry_of) {
    document.getElementById("retry-hint").innerHTML =
      `This is a new attempt after an earlier run. <a class="link" href="run.html?id=${encodeURIComponent(run.params.retry_of)}">See the one it replaced</a>`;
  }
}

/* A failed run explains itself here: what happened, what to do, and one button
   that goes to the page where it gets fixed. */
function renderGuidance(guidance) {
  const box = document.getElementById("run-guidance");
  box.innerHTML = "";
  if (!guidance) return;
  const card = el("div", { class: "error-box" }, [
    el("strong", { text: guidance.what_happened }, []),
    el("p", { text: guidance.what_to_do }, []),
  ]);
  if (guidance.action?.label) {
    card.appendChild(el("a", { class: "button-link", href: guidance.action.href }, [guidance.action.label]));
  }
  if (guidance.technical_detail) {
    card.appendChild(el("details", { class: "error-detail" }, [
      el("summary", { text: "Technical detail" }, []),
      el("p", { text: guidance.technical_detail }, []),
    ]));
  }
  box.appendChild(card);
}

function renderFiles(files) {
  const tbody = document.getElementById("files-body");
  tbody.innerHTML = "";
  if (!files.length) {
    tbody.appendChild(el("tr", {}, [el("td", { colspan: "5", class: "empty" }, ["None"])]));
    return;
  }
  for (const file of files) {
    tbody.appendChild(el("tr", {}, [
      el("td", {}, [file.original_name || file.path]),
      el("td", {}, [statusBadge(VALIDATION_STATUS_LABELS, file.validation_status)]),
      el("td", {}, [formatSize(file.size_bytes)]),
      el("td", {}, [file.row_count == null ? "—" : String(file.row_count)]),
      el("td", {}, [el("a", { class: "link", href: `/api/files/${encodeURIComponent(file.id)}/download` }, ["Download"])]),
    ]));
  }
}

function renderSteps(steps) {
  const tbody = document.getElementById("steps-body");
  tbody.innerHTML = "";
  if (!steps.length) {
    tbody.appendChild(el("tr", {}, [el("td", { colspan: "4", class: "empty" }, ["Not started yet"])]));
    return;
  }
  for (const step of steps) {
    tbody.appendChild(el("tr", {}, [
      el("td", {}, [step.name]),
      el("td", {}, [statusBadge(STEP_STATUS_LABELS, step.status)]),
      el("td", {}, [String(step.attempt)]),
      el("td", { class: "muted" }, [step.error_message || "—"]),
    ]));
  }
}

function renderEvents(events) {
  const list = document.getElementById("events-list");
  list.innerHTML = "";
  if (!events.length) {
    list.appendChild(el("li", { class: "empty" }, ["Nothing recorded"]));
    return;
  }
  for (const evt of events) {
    list.appendChild(el("li", {}, [
      el("span", { class: "msg" }, [evt.message || EVENT_TYPE_LABELS[evt.type] || evt.type]),
      el("span", { class: "time" }, [formatDate(evt.created_at)]),
    ]));
  }
}

async function load() {
  if (!runId) return;
  try {
    const [detail, events] = await Promise.all([
      getJSON(`/api/runs/${encodeURIComponent(runId)}`),
      getJSON(`/api/runs/${encodeURIComponent(runId)}/events`),
    ]);
    renderRunInfo(detail.run);
    renderGuidance(detail.guidance);
    renderFiles(detail.files || []);
    renderSteps(detail.steps);
    renderEvents(events.items);
  } catch (err) {
    showError(errorBox, err);
  }
}

/* A finished-but-failed run is retried as a new attempt (and the page follows
   that new run); an unfinished one is simply continued. Sending both down the
   same endpoint is what used to make this button a no-op on failed runs. */
document.getElementById("retry-button").addEventListener("click", async (event) => {
  const button = event.target;
  const failed = currentRun && ["failed", "cancelled"].includes(currentRun.status);
  button.disabled = true;
  document.getElementById("retry-hint").textContent = failed ? "Starting a new attempt…" : "Continuing…";
  clearError(errorBox);
  try {
    if (failed) {
      const fresh = await postJSON(`/api/runs/${encodeURIComponent(runId)}/retry`, {});
      location.href = `run.html?id=${encodeURIComponent(fresh.id)}`;
      return;
    }
    await postJSON(`/api/runs/${encodeURIComponent(runId)}/start`, {});
    document.getElementById("retry-hint").textContent = "";
    await load();
  } catch (err) {
    showError(errorBox, err);
    document.getElementById("retry-hint").textContent = "";
    button.disabled = false;
  }
});

if (runId) {
  load();
  const socket = connectEvents(runId, () => load());
  socket.onopen = () => document.getElementById("live-dot").classList.add("on");
  socket.onclose = () => document.getElementById("live-dot").classList.remove("on");
  // A run executed by the background worker can finish between events; poll as
  // a backstop so the page never shows a stale "running".
  setInterval(load, 4000);
}
</script>
</body>
</html>
