<!doctype html>
<meta charset="utf-8">
<title>Popup sign-in</title>
<!-- The popup half of popup_login.html: it confirms, tells its opener, and
     closes itself, the way a real SSO handshake window does. -->
<body style="font:15px system-ui">
  <input id="ssoUsername" placeholder="Operator username">
  <button id="btnConfirmSignIn">Confirm sign-in</button>
  <script>
    document.getElementById('btnConfirmSignIn').addEventListener('click', () => {
      window.opener.postMessage('signed-in', '*');
      setTimeout(() => window.close(), 800);
    });
  </script>
</body>
