<!doctype html>
<meta charset="utf-8">
<title>The button was renamed overnight</title>
<!-- What actually happens to an automation after a release: the control is
     still there, still in the same place, doing the same job — under a
     different name and a different id. Every recorded locator misses. -->
<body style="font:15px system-ui">
  <button id="btnSearch">Search</button>
  <button id="btnClear">Clear</button>
</body>
