<!doctype html><html><head><meta charset="utf-8"><title>Daily sales</title></head>
<body>
<div id="user-menu">Signed in as tester</div>
<h1>Daily sales</h1>

<!-- A text field: typing must be recorded as a value, not as clicks. -->
<label>Reference <input id="reference" type="text" /></label>

<!-- A password field: its value must NEVER reach the recording. -->
<label>Confirm password <input id="secret" type="password" /></label>

<!-- A dropdown: needs a change event, not a click. -->
<label>Period
  <select id="period">
    <option value="">Choose…</option>
    <option value="daily">Daily</option>
    <option value="monthly">Monthly</option>
  </select>
</label>

<!-- Responds to Enter, not to a click: proves keyboard steps are captured. -->
<label>Filter <input id="filter" type="text" /></label>
<div id="filter-applied" hidden>Filter applied</div>

<!-- Appears only after a delay: proves waiting is a real step. -->
<button id="prepare">Prepare report</button>
<div id="ready" hidden>Report is ready</div>

<!-- A real menu transition: the second control cannot receive a click until
     the first one has opened this section.  It is the browser fixture for
     chained, next-step proof. -->
<button id="open-report-tools">Open report tools</button>
<button id="daily-report-action" hidden>Choose daily report</button>
<div id="daily-report-selected" hidden>Daily report selected</div>

<!-- Opens a second tab: proves window switching. -->
<a id="open-details" href="details.html" target="_blank">Open details in a new tab</a>

<!-- Content the main document cannot see: proves frame handling. -->
<iframe id="totals" src="totals.html" width="400" height="120"></iframe>

<!-- A Nexacro-like control redraws the pressed node on mouse-down. -->
<div id="org-tree" role="tree" aria-label="Organisation"></div>
<div id="org-state">Org All</div>
<div id="org-vd-selected" hidden>VD selected</div>
<button id="inquiry">Inquiry</button>
<div id="org-required" hidden>Select an organisation before Inquiry</div>
<div id="inquiry-result" hidden>Inquiry result</div>

<!-- Two separate downloads in one task. -->
<a id="download-summary" href="summary.txt" download="summary.csv">Download summary</a>
<a id="download-detail" href="detail.txt" download="detail.csv">Download detail</a>

<script>
  document.getElementById('filter').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('filter-applied').hidden = false;
  });
  document.getElementById('prepare').addEventListener('click', () => {
    setTimeout(() => { document.getElementById('ready').hidden = false; }, 700);
  });
  document.getElementById('open-report-tools').addEventListener('click', () => {
    document.getElementById('daily-report-action').hidden = false;
  });
  document.getElementById('daily-report-action').addEventListener('click', () => {
    document.getElementById('daily-report-selected').hidden = false;
  });

  let orgChecked = false;
  function renderOrg() {
    // Replaces the pressed node before mouseup, like a component tree redraw.
    document.getElementById('org-tree').innerHTML =
      '<button id="org-vd-box" type="button" aria-pressed="' + orgChecked + '">VD</button>';
    document.getElementById('org-state').textContent = orgChecked ? 'Org VD' : 'Org All';
    document.getElementById('org-vd-selected').hidden = !orgChecked;
  }
  renderOrg();
  window.__orgClickEvents = 0;
  document.getElementById('org-tree').addEventListener('mousedown', (e) => {
    if (!e.target.closest('#org-vd-box')) return;
    e.preventDefault();
    orgChecked = true;
    renderOrg();
  });
  document.getElementById('org-tree').addEventListener('click', () => { window.__orgClickEvents += 1; });
  document.getElementById('inquiry').addEventListener('click', () => {
    if (!orgChecked) {
      document.getElementById('org-required').hidden = false;
      return;
    }
    document.getElementById('inquiry-result').hidden = false;
  });
</script>
</body></html>
