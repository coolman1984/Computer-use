[project]
name = "smartops"
version = "0.1.0"
description = "Local intelligent automation and operations control center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "playwright>=1.50",
  "pydantic-settings>=2.6",
  "duckdb>=1.1",
  "pyyaml>=6.0",
]

[project.scripts]
smartops = "smartops.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
